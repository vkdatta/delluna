<!doctype html><html><head><meta charset="utf-8"><style>body{font:12px Inter,system-ui;margin:0;padding:16px;color:#1b1c1e}h2{margin:0 0 12px;font-size:18px}.row{display:flex;gap:7px;margin:7px 0}input,select,button{font:inherit;box-sizing:border-box}input,select{width:100%;height:34px;border:1px solid #ddd;border-radius:8px;padding:0 9px;background:#fff}button{height:34px;border:1px solid #ddd;border-radius:8px;background:#fff;padding:0 10px;cursor:pointer}button.primary{background:#1b1c1e;color:#fff;border-color:#1b1c1e}.muted{color:#777;font-size:10px}.list{height:390px;overflow:auto;border:1px solid #e4e5e7;border-radius:10px;margin-top:10px}.item{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:9px;padding:8px;border-bottom:1px solid #eee}.preview{width:34px;height:34px;display:flex;align-items:center;justify-content:center}.preview img{width:30px;height:30px;display:block}.name{font-weight:600}.path{font-size:9px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:30px;text-align:center;color:#777}</style></head><body><h2>Delluna</h2><div class="row"><input id="base" placeholder="CDN base URL"></div><div class="row"><input id="search" placeholder="Search icons…"></div><div class="row"><select id="style"><option value="single">Single tone</option><option>outline</option><option>fill</option><option>solid</option><option>duotone</option><option>duocolor</option></select><select id="variant"><option>og</option><option>hud</option><option>orbit</option><option>circuit</option><option>plasma</option></select></div><div id="status" class="muted">Loading registry…</div><div id="list" class="list"></div><p class="muted">Import creates a native Figma vector. Motion is a web/runtime behavior and is not baked into the Figma vector.</p><script>
let data=null;const $=id=>document.getElementById(id);$('base').value=localStorage.getItem('dellunaBase')||'https://cdn.jsdelivr.net/gh/vkdatta/delluna@main/dist';function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function boot(){try{data=await (await fetch($('base').value.replace(/\/$/,'')+'/registry.json')).json();render()}catch(e){$('status').textContent=e.message}}function render(){const q=$('search').value.toLowerCase();const arr=Object.values(data.icons||{}).filter(x=>!x.aliasOf&&(`${x.name} ${x.path||''} ${(x.tags||[]).join(' ')}`).toLowerCase().includes(q)).slice(0,250);$('status').textContent=`${arr.length} matches`;$('list').innerHTML=arr.map(x=>{const p=String(x.path||'').split('/').map(encodeURIComponent).join('/');const u=$('base').value.replace(/\/$/,'')+`/icons/${p}${x.hash?`?v=${encodeURIComponent(x.hash)}`:''}`;return `<div class="item"><div class="preview"><img src="${esc(u)}" alt=""></div><div><div class="name">${esc(x.name)}</div><div class="path">${esc(x.path||'')}</div></div><button data-id="${esc(x.id)}">Add</button></div>`}).join('');$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=arr.find(i=>i.id===b.dataset.id);parent.postMessage({pluginMessage:{type:'import',base:$('base').value,name:x.name,path:x.path,hash:x.hash,style:$('style').value,variant:$('variant').value}},'*')})}$('search').addEventListener('input',render);$('style').addEventListener('change',render);$('variant').addEventListener('change',render);$('base').onchange=()=>{localStorage.setItem('dellunaBase',$('base').value);boot()};boot();
</script></body></html>
