name: Delluna Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate
      - run: npm run build
      - run: |
          git config user.name "Delluna Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json registry/icons.json dist
          git diff --cached --quiet || git commit -m "build: update Delluna distribution"
          git push
